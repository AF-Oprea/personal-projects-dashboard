name: Validate commit identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require AF-Oprea as author and committer, no Co-authored-by
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_name='AF-Oprea'
          expected_email='37816944+AF-Oprea@users.noreply.github.com'
          zero='0000000000000000000000000000000000000000'
          # pull_request checkouts are a merge commit (author=display name, committer=GitHub).
          # Only scan PR head commits: base..head.sha — never include the ephemeral merge.
          # push: before..after. New branch (zero before) or a before that is gone
          # (force-push): commits not reachable from any other remote branch; if there
          # is no other branch either, fail (the range cannot be determined).
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            rev_args=("${PR_BASE_SHA}..${PR_HEAD_SHA}")
          else
            if [ "${PUSH_AFTER}" = "$zero" ]; then
              echo "Branch deletion: nothing to check."
              exit 0
            fi
            before=''
            if [ -n "${PUSH_BEFORE:-}" ] && [ "${PUSH_BEFORE}" != "$zero" ]; then
              if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                git fetch --no-tags --quiet origin "${PUSH_BEFORE}" 2>/dev/null || true
              fi
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                before="${PUSH_BEFORE}"
              fi
            fi
            if [ -n "$before" ]; then
              rev_args=("${before}..${PUSH_AFTER}")
            else
              mapfile -t others < <(git for-each-ref --format='%(refname)' refs/remotes/origin |
                grep -vxF -e "refs/remotes/origin/${PUSH_REF#refs/heads/}" -e 'refs/remotes/origin/HEAD' || true)
              if [ "${#others[@]}" -gt 0 ]; then
                rev_args=("${PUSH_AFTER}" --not "${others[@]}")
              else
                # Fail closed: without a base the pushed range cannot be determined.
                echo "::error::No base found for this push (before missing and no other branch); cannot determine the pushed commits."
                exit 1
              fi
            fi
          fi
          echo "Checking commit range: ${rev_args[*]}"
          if ! log_out="$(git log --format='%H%x09%an%x09%ae%x09%cn%x09%ce%x09%s' "${rev_args[@]}")"; then
            echo "::error::git log failed for ${rev_args[*]}."
            exit 1
          fi
          echo "$log_out"
          fail=0
          if ! printf '%s\n' "$log_out" | \
            awk -F '\t' -v name="$expected_name" -v email="$expected_email" \
              'NF && ($2 != name || $3 != email || $4 != name || $5 != email) { print; exit 1 }'
          then
            echo "::error::All commits must use $expected_name <$expected_email>."
            fail=1
          fi
          # Fail closed when git fails: never treat an unreadable range or message as clean.
          if ! commits="$(git rev-list "${rev_args[@]}")"; then
            echo "::error::git rev-list failed for ${rev_args[*]}."
            exit 1
          fi
          for c in $commits; do
            if ! msg="$(git log -1 --format=%B "$c")"; then
              echo "::error::git log failed for commit $c."
              exit 1
            fi
            if lines="$(printf '%s\n' "$msg" | grep -inE '^[[:space:]]*co-authored-by[[:space:]]*:')"; then
              echo "::error::Commit $c has a Co-authored-by line (not allowed on this public repo): $lines"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: all commits in range use $expected_name <$expected_email> and have no Co-authored-by lines."
