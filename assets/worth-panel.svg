<rect x="24" y="16" width="832" height="26" rx="8" fill="#151820"/>
<text x="60" y="33" fill="#9a9aa8" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.1">STREAM</text>
<text x="260" y="33" fill="#9a9aa8" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.1">CXP</text>
<text x="316" y="33" fill="#9a9aa8" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.1">UTIL</text>
<text x="380" y="33" fill="#9a9aa8" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.1">LOC</text>
