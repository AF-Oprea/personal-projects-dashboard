<text x="28" y="100" fill="#6f7380" font-size="9" font-family="ui-sans-serif, system-ui, sans-serif">order: complexity → LOC → utility · CXP/UTIL from roadmap.json · LOC = non-blank source lines in local clones · index = round(100 × utility ÷ (complexity + 0.5)) · chapters on pulse.svg only</text>
